[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "williamization"
version = "1.0.0"
description = "Cognitive Motion & Anti-Smoothing Protocol for AI Agents"
requires-python = ">=3.9"
readme = "README.md"
authors = [
    { name = "DryZebra", email = "developer@users.noreply.github.com" }
]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.110.0",
    "starlette>=0.36.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0"
]

[project.urls]
Homepage = "https://williamization-engine.vercel.app"
Repository = "https://github.com/DryZebra/williamization"
